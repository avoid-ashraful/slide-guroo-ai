version: '3.8'

services:
  # Backend Service
  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
      platform: linux/arm64
    container_name: slideguroo-backend
    ports:
      - "8000:8000"
    volumes:
      # Mount source code for hot reload in development
      - ./be:/app
      # Persist uploads
      - backend-uploads:/app/uploads
      # Don't mount venv or __pycache__
      - /app/venv
      - /app/__pycache__
    environment:
      # These can be overridden by .env file
      - HOST=0.0.0.0
      - PORT=8000
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      # LLM Configuration (MUST be set in .env file)
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4-turbo-preview}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-3-sonnet-20240229}
      # Upload Configuration
      - MAX_UPLOAD_SIZE=${MAX_UPLOAD_SIZE:-10485760}
      - UPLOAD_DIR=./uploads
    env_file:
      - ./be/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - slideguroo-network

  # Frontend Service
  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
      platform: linux/arm64
    container_name: slideguroo-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - slideguroo-network

volumes:
  backend-uploads:
    driver: local

networks:
  slideguroo-network:
    driver: bridge
