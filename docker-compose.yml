version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: slideguroo-postgres
    platform: linux/arm64
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=slideguroo
      - POSTGRES_PASSWORD=slideguroo123
      - POSTGRES_DB=slideguroo_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slideguroo"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - slideguroo-network

  # Backend Service
  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
      platform: linux/arm64
    container_name: slideguroo-backend
    ports:
      - "8000:8000"
    volumes:
      # Mount source code for hot reload in development
      - ./be:/app
      # Persist uploads
      - backend-uploads:/app/uploads
      # Don't mount venv or __pycache__
      - /app/venv
      - /app/__pycache__
    environment:
      # These can be overridden by .env file
      - HOST=0.0.0.0
      - PORT=8000
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      # Database Configuration
      - DATABASE_URL=postgresql+asyncpg://slideguroo:slideguroo123@postgres:5432/slideguroo_db
      # LLM Configuration (MUST be set in .env file)
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4-turbo-preview}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-3-sonnet-20240229}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      # Auth Configuration
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - FRONTEND_URL=http://localhost:3000
      # Email Configuration (console mode for development)
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-noreply@slideguroo.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_SERVER=${MAIL_SERVER:-smtp.gmail.com}
      # Upload Configuration
      - MAX_UPLOAD_SIZE=${MAX_UPLOAD_SIZE:-10485760}
      - UPLOAD_DIR=./uploads
    env_file:
      - ./be/.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - slideguroo-network

  # Frontend Service
  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
      platform: linux/arm64
    container_name: slideguroo-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - slideguroo-network

volumes:
  backend-uploads:
    driver: local
  postgres-data:
    driver: local

networks:
  slideguroo-network:
    driver: bridge
